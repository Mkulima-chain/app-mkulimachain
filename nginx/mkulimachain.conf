# ===========================================================================
# Nginx — MkulimaChain
#
# HTTP uniquement. Certbot ajoute automatiquement les blocs 443 / SSL
# (certbot --nginx ... --redirect).
#
# Mapping :
#   mkulimachain.com       -> apps/web   (Next.js, port 5601)
#   www.mkulimachain.com   -> redirection 301 vers mkulimachain.com
#   app.mkulimachain.com   -> apps/admin (Next.js, port 5602)
#   api.mkulimachain.com   -> apps/api   (NestJS, port 5600, préfixe global /api)
# ===========================================================================

# ---------------------------------------------------------------------------
# Gestion propre de l'en-tête Connection pour les WebSockets.
# Un `Connection: upgrade` envoyé en dur sur CHAQUE requête casse le keep-alive
# HTTP ordinaire ; cette map ne l'envoie que lorsque le client demande vraiment
# une bascule WebSocket.
#
# `map` est valide ici : sites-enabled/* est inclus dans le bloc http{}.
# Si un autre site du serveur définit déjà $connection_upgrade, Nginx refusera
# le doublon — dans ce cas, supprimez ce bloc de ce fichier.
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# API — api.mkulimachain.com -> NestJS (5600)
# Gère aussi les WebSockets (socket.io : chat + notifications temps réel).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.mkulimachain.com;

    # Uploads d'images (photos de récoltes, NFT, avatars) — défaut Nginx : 1 Mo.
    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:5600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Les transactions Cardano (soumission on-chain) peuvent être lentes.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# Web public — mkulimachain.com -> Next.js (5601)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name mkulimachain.com;

    client_max_body_size 20M;

    # Servir les assets buildés de Next.js avec un cache long (ils sont hashés).
    location /_next/static/ {
        proxy_pass http://localhost:5601;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:5601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------------------------------------------------------------------------
# www — redirection permanente vers le domaine canonique (SEO)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name www.mkulimachain.com;
    return 301 https://mkulimachain.com$request_uri;
}

# ---------------------------------------------------------------------------
# Admin / back-office — app.mkulimachain.com -> Next.js (5602)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name app.mkulimachain.com;

    client_max_body_size 20M;

    location /_next/static/ {
        proxy_pass http://localhost:5602;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:5602;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
